name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install build tools
        run: npm install --no-save lightningcss-cli html-minifier-terser

      - name: Build minified dist/
        run: |
          set -euo pipefail
          mkdir -p dist

          cp -r robots.txt sitemap.xml favicon.ico dist/ 2>/dev/null || true

          # Extract CSS so a CSS-aware parser handles native nesting.
          node -e '
            const fs = require("fs");
            const html = fs.readFileSync("index.html", "utf8");
            const m = html.match(/<style>([\s\S]*?)<\/style>/);
            fs.writeFileSync("_extracted.css", m ? m[1] : "");
          '

          # Minify while preserving native CSS Nesting syntax.
          npx --yes lightningcss \
            --minify \
            _extracted.css \
            -o _extracted.min.css

          node -e '
            const fs = require("fs");
            const html = fs.readFileSync("index.html", "utf8");
            const css = fs.readFileSync("_extracted.min.css", "utf8");
            fs.writeFileSync(
              "_prebuilt.html",
              html.replace(/<style>[\s\S]*?<\/style>/, () => "<style>" + css + "</style>"),
            );
          '

          # Minify HTML and inline JavaScript without reparsing CSS.
          npx --yes html-minifier-terser _prebuilt.html \
            --collapse-whitespace \
            --collapse-boolean-attributes \
            --remove-comments \
            --remove-redundant-attributes \
            --remove-empty-attributes \
            --remove-attribute-quotes \
            --remove-optional-tags \
            --use-short-doctype \
            --minify-css false \
            --minify-js true \
            -o dist/index.html

          du -h dist/index.html
          gzip -9 -c dist/index.html | wc -c
          rm -f _extracted.css _extracted.min.css _prebuilt.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
