name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install build tools
        run: npm install --no-save html-minifier-terser

      - name: Build minified dist/
        run: |
          set -euo pipefail
          mkdir -p dist

          cp -r robots.txt sitemap.xml favicon.ico dist/ 2>/dev/null || true

          # Minify HTML, native CSS nesting, and inline JavaScript in one pass.
          npx --yes html-minifier-terser index.html \
            --collapse-whitespace \
            --collapse-boolean-attributes \
            --remove-comments \
            --remove-redundant-attributes \
            --remove-empty-attributes \
            --remove-attribute-quotes \
            --remove-optional-tags \
            --use-short-doctype \
            --minify-css true \
            --minify-js true \
            -o dist/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
